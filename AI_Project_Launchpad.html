<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Project Launchpad</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1020;
      color: #f5f7ff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
    .card {
      width: min(900px, 100%);
      background: linear-gradient(145deg, #151d35, #0f1528);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 24px;
      padding: 48px;
      box-shadow: 0 24px 70px rgba(0,0,0,.4);
    }
    .eyebrow {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(99,102,241,.15);
      color: #a5b4fc;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(40px, 7vw, 72px);
      line-height: .98;
      letter-spacing: -.04em;
    }
    .workshop {
      font-size: 22px;
      line-height: 1.5;
      color: #d7dcf0;
      margin: 28px 0;
    }
    .free {
      color: #86efac;
      font-weight: 800;
    }
    .note {
      border-top: 1px solid rgba(255,255,255,.1);
      padding-top: 22px;
      color: #9da7c2;
      font-size: 14px;
      line-height: 1.6;
    }
    @media (max-width: 600px) {
      body { padding: 16px; }
      .card { padding: 30px 24px; border-radius: 18px; }
      .workshop { font-size: 18px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">NxtWave Growth Challenge</div>
    <h1>AI Project Launchpad</h1>
    <div class="workshop">
      Workshop: <strong>"Build Your First AI Project in 60 Minutes"</strong>
      <span class="free">(free, online)</span>.
      Date and time to be confirmed by NxtWave.
    </div>
    <div class="note">
      Simulation prototype. Data stays in your browser.
      Dashboard model numbers are plan assumptions, not real results.
    </div>
  </main>
</body>
</html>
